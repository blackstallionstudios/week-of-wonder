<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Week of Wonder</title>
    <meta name="description" content="A risograph task zine: one pane for this week, one for someday." />
    <meta name="theme-color" content="#f4efe4" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wonder" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('week-of-wonder') || '{}')
        var t = s && s.state && s.state.settings && s.state.settings.theme
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Week of Wonder needs JavaScript to print your tickets.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
